<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | GreenLeaf Nursery</title>
<meta name="robots" content="noindex, nofollow, noarchive">
    

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f4f8f3;
        }


        /* =====================================================
           LOGIN WRAPPER
        ===================================================== */

        .login-wrapper {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }


        /* =====================================================
           LOGIN CARD
        ===================================================== */

        .login-card {
            width: 100%;
            max-width: 430px;

            background: #ffffff;

            border-radius: 18px;

            padding: 40px;

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.08);

            border: 1px solid #e8eee6;
        }


        /* =====================================================
           LOGO / BRAND
        ===================================================== */

        .login-brand {
            text-align: center;

            margin-bottom: 30px;
        }

        .login-logo {
            width: 72px;
            height: 72px;

            object-fit: contain;

            margin-bottom: 15px;
        }

        .login-brand h1 {
            font-size: 25px;

            font-weight: 700;

            margin: 0;

            color: #1f3d2b;
        }

        .login-brand p {
            margin: 7px 0 0;

            font-size: 14px;

            color: #777;
        }


        /* =====================================================
           FORM
        ===================================================== */

        .form-label {
            font-weight: 600;

            font-size: 14px;

            color: #344238;
        }


        .form-control {
            min-height: 48px;

            border-radius: 10px;

            border: 1px solid #d9e2d8;

            padding: 12px 14px;

            font-size: 15px;

            box-shadow: none;
        }

        .form-control:focus {
            border-color: #4d8b5a;

            box-shadow:
                0 0 0 3px rgba(77, 139, 90, 0.12);
        }


        /* =====================================================
           PASSWORD
        ===================================================== */

        .password-wrapper {
            position: relative;
        }

        .password-wrapper .form-control {
            padding-right: 50px;
        }

        .password-toggle {
            position: absolute;

            top: 50%;
            right: 14px;

            transform: translateY(-50%);

            border: 0;

            background: transparent;

            color: #777;

            cursor: pointer;

            padding: 4px 6px;
        }


        /* =====================================================
           LOGIN BUTTON
        ===================================================== */

        .login-btn {
            width: 100%;

            min-height: 50px;

            border: 0;

            border-radius: 10px;

            background: #2f6f3e;

            color: #ffffff;

            font-size: 16px;

            font-weight: 600;

            transition: 0.2s ease;
        }

        .login-btn:hover {
            background: #245b31;
        }

        .login-btn:disabled {
            opacity: 0.7;

            cursor: not-allowed;
        }


        /* =====================================================
           ERROR MESSAGE
        ===================================================== */

        .login-error {
            display: none;

            border-radius: 8px;

            padding: 10px 12px;

            margin-bottom: 18px;

            background: #fff1f1;

            color: #b42318;

            font-size: 14px;
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .login-footer {
            text-align: center;

            margin-top: 25px;

            font-size: 13px;

            color: #888;
        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 576px) {

            .login-wrapper {
                padding: 15px;
            }

            .login-card {
                padding: 30px 24px;

                border-radius: 15px;
            }

            .login-brand h1 {
                font-size: 23px;
            }

        }


        /* =====================================================
           SMALL MOBILE
        ===================================================== */

        @media (max-width: 360px) {

            .login-wrapper {
                padding: 10px;
            }

            .login-card {
                padding: 25px 18px;
            }

            .login-logo {
                width: 62px;
                height: 62px;
            }

            .login-brand h1 {
                font-size: 21px;
            }

            .form-control {
                min-height: 46px;
            }

            .login-btn {
                min-height: 48px;
            }

        }

    </style>

</head>


<body>


<div class="login-wrapper">

    <div class="login-card">


        <!-- =================================================
             BRAND
        ================================================= -->

        <div class="login-brand">

            <img
                src="assets/images/icon-192.png"
                alt="GreenLeaf Nursery"
                class="login-logo"
            >

            <h1>
                GreenLeaf Nursery
            </h1>

            <p>
                Admin Panel
            </p>

        </div>


        <!-- =================================================
             LOGIN ERROR
        ================================================= -->

        <div
            id="loginError"
            class="login-error"
            role="alert"
        ></div>


        <!-- =================================================
             LOGIN FORM
        ================================================= -->

        <form id="adminLoginForm">


            <!-- Email -->

            <div class="mb-3">

                <label
                    for="email"
                    class="form-label"
                >
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="admin@example.com"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- Password -->

            <div class="mb-4">

                <label
                    for="password"
                    class="form-label"
                >
                    Password
                </label>


                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >


                    <button
                        type="button"
                        id="togglePassword"
                        class="password-toggle"
                        aria-label="Show password"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- Login Button -->

            <button
                type="submit"
                id="loginButton"
                class="login-btn"
            >
                Login
            </button>


        </form>


        <div class="login-footer">

            © <?= date("Y") ?> GreenLeaf Nursery

        </div>


    </div>

</div>


<script>

document.addEventListener("DOMContentLoaded", () => {


    const form =
        document.getElementById("adminLoginForm");

    const password =
        document.getElementById("password");

    const togglePassword =
        document.getElementById("togglePassword");

    const errorBox =
        document.getElementById("loginError");

    const loginButton =
        document.getElementById("loginButton");


    /* =====================================================
       SHOW / HIDE PASSWORD
    ===================================================== */

    togglePassword.addEventListener("click", () => {

        const isPassword =
            password.type === "password";

        password.type =
            isPassword ? "text" : "password";

        togglePassword.textContent =
            isPassword ? "🙈" : "👁";

        togglePassword.setAttribute(
            "aria-label",
            isPassword
                ? "Hide password"
                : "Show password"
        );

    });


    /* =====================================================
       LOGIN FORM
    ===================================================== */

    form.addEventListener("submit", async (event) => {

        event.preventDefault();


        errorBox.style.display = "none";

        errorBox.textContent = "";


        const email =
            document.getElementById("email")
                .value
                .trim();

        const passwordValue =
            password.value;


        if (!email || !passwordValue) {

            errorBox.textContent =
                "Please enter your email and password.";

            errorBox.style.display = "block";

            return;
        }


        loginButton.disabled = true;

        loginButton.textContent = "Logging in...";


        try {

            const response =
                await fetch("api/admin_login.php", {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: passwordValue
                    })

                });


            const result =
                await response.json();


            if (!response.ok || !result.success) {

                throw new Error(
                    result.message ||
                    "Invalid email or password."
                );

            }


            window.location.href =
                "index.php";


        } catch (error) {

            console.error(
                "Login error:",
                error
            );


            errorBox.textContent =
                error.message ||
                "Unable to login. Please try again.";

            errorBox.style.display =
                "block";


        } finally {

            loginButton.disabled = false;

            loginButton.textContent =
                "Login";

        }

    });

});

</script>


</body>

</html>
